[package]
name = "codex-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Stable native bridge around selected Codex CLI capabilities"

[lib]
name = "codex_bridge"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "codex-bridge-login"
path = "src/bin/codex-bridge-login.rs"

[workspace]
members = ["http-bridge"]
exclude = ["upstream/codex"]

[dependencies]
codex-http-client = { path = "upstream/codex/codex-rs/http-client" }
codex-login = { path = "upstream/codex/codex-rs/login" }
codex-model-provider = { path = "upstream/codex/codex-rs/model-provider" }
codex-model-provider-info = { path = "upstream/codex/codex-rs/model-provider-info" }
codex-models-manager = { path = "upstream/codex/codex-rs/models-manager" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }

# Path dependencies inherit their package metadata from the Codex workspace, but Cargo applies
# source patches only from this bridge workspace root. Keep these aligned with upstream/codex-
# rs/Cargo.toml so the exact dependency graph used by Codex remains buildable here.
[patch.crates-io]
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "0e5b2d73aa18dd9f0a50ee9ff199d5aef7594186" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "4fffad30fe373adbdcffab9545e9e9bf4f2fc19f" }

# The Codex dependency graph is large. Keep local bridge builds compact enough for constrained
# developer machines; release artifacts do not need Rust debug information.
[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.release]
debug = 0
strip = "symbols"
lto = false
codegen-units = 16
