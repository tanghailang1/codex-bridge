[package]
name = "codex-http-bridge"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Native HTTP Responses bridge backed by the Codex CLI wire implementation"

[lib]
name = "codex_http_bridge"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "codex-bridge-http"
path = "src/bin/codex-bridge-http.rs"

[dependencies]
codex-api = { path = "../upstream/codex/codex-rs/codex-api" }
codex-http-client = { path = "../upstream/codex/codex-rs/http-client" }
codex-login = { path = "../upstream/codex/codex-rs/login" }
codex-model-provider-info = { path = "../upstream/codex/codex-rs/model-provider-info" }
codex-protocol = { path = "../upstream/codex/codex-rs/protocol" }
futures = "0.3"
http = "1.3"
reqwest = { version = "0.12", features = ["cookies"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
